


<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Toothpaste Store</title>

<style>

body {

  font-family: Arial, sans-serif;

  margin: 0;

  background: #f5f7f7;

  color: #234;

}

header {

  background: #16866b;

  color: white;

  padding: 25px;

  text-align: center;

}

h1 { margin: 0; }

.container {

  max-width: 900px;

  margin: 30px auto;

  padding: 15px;

}

.products {

  display: grid;

  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));

  gap: 20px;

}

.card {

  background: white;

  padding: 22px;

  border-radius: 15px;

  text-align: center;

  box-shadow: 0 3px 12px #ddd;

}

.photo {

  font-size: 65px;

}

button {

  background: #16866b;

  color: white;

  border: 0;

  padding: 12px 20px;

  border-radius: 8px;

  cursor: pointer;

}

.cart {

  background: white;

  padding: 20px;

  margin-top: 25px;

  border-radius: 12px;

}

input {

  display: block;

  width: 95%;

  padding: 10px;

  margin: 10px 0;

}

</style>

</head>

<body>

<header>

<h1>🦷 Toothpaste Store</h1>

<p>ร้านขายยาสีฟันออนไลน์</p>

</header>

<div class="container">

<h2>สินค้าที่แนะนำ</h2>

<div class="products">

<div class="card">

<div class="photo">🌿</div>

<h3>ยาสีฟันสมุนไพร</h3>

<p>สูตรสมุนไพร ดูแลช่องปาก</p>

<p>ราคา 89 บาท</p>

<button onclick="add(0)">เพิ่มลงตะกร้า</button>

</div>

<div class="card">

<div class="photo">✨</div>

<h3>ยาสีฟันเฟรชมิ้นต์</h3>

<p>สูตรเย็นสดชื่น ลมหายใจหอม</p>

<p>ราคา 99 บาท</p>

<button onclick="add(1)">เพิ่มลงตะกร้า</button>

</div>

</div>

<div class="cart">

<h2>🛒 ตะกร้าสินค้า</h2>

<div id="items">ยังไม่มีสินค้า</div>

<h3>รวม <span id="total">0</span> บาท</h3>

<h3>ข้อมูลจัดส่ง</h3>

<input id="name" placeholder="ชื่อผู้รับ">

<input id="address" placeholder="ที่อยู่จัดส่ง">

<input id="phone" placeholder="เบอร์โทรศัพท์">

<button onclick="checkout()">ยืนยันคำสั่งซื้อ</button>

</div>

</div>

<script>

const products = [

  {name: "ยาสีฟันสมุนไพร", price: 89},

  {name: "ยาสีฟันเฟรชมิ้นต์", price: 99}

];

let cart = [];

function add(index) {

  cart.push(products[index]);

  updateCart();

}

function updateCart() {

  let total = 0;

  let html = "";

  cart.forEach(item => {

    html += "<p>" + item.name + " - " + item.price + " บาท</p>";

    total += item.price;

  });

  document.getElementById("items").innerHTML =

    html || "ยังไม่มีสินค้า";

  document.getElementById("total").innerText = total;

}

function checkout() {

  const name = document.getElementById("name").value;

  const address = document.getElementById("address").value;

  const phone = document.getElementById("phone").value;

  if (cart.length === 0) {

    alert("กรุณาเลือกสินค้าก่อน");

    return;

  }

  if (!name || !address || !phone) {

    alert("กรุณากรอกข้อมูลจัดส่งให้ครบ");

    return;

  }

  alert("ขอบคุณสำหรับคำสั่งซื้อ " + name +

        "\nยอดชำระ " +

        document.getElementById("total").innerText +

        " บาท");

  cart = [];

  updateCart();

}

</script>

</body>

</html>
